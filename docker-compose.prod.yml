# Portainer / homelab production stack.
# Pull-only from GHCR (no build:). Images are produced by CI via Dockerfile.prod.
# If packages are public, no registry auth is needed. If private, add ghcr.io
# credentials in Portainer → Registries (PAT with read:packages).
#
# Deploy:
#   1. If GHCR packages are private, add registry credentials in Portainer
#   2. Create stack from this repo file, or paste compose + load stack.env
#   3. Override IMAGE_TAG / ports in stack.env as needed
#      IMAGE_TAG=latest | build-<CI_run_number> | sha-<short>
#      (build identity also on GET /healthz → version)
#
# Profiles (COMPOSE_PROFILES in stack.env):
#   (empty)       gen only
#   proxy         gen + fastproxy
#   edge          gen + nginx TLS front door (see deploy/nginx/)
#   edge,proxy    gen + fastproxy + nginx
#
# Jellyfin Live TV (gen-only) — see README:
#   Tuner M3U:  http://HOST:${FASTGEN_HOST_PORT:-8180}/playlist.m3u
#   Guide XMLTV: http://HOST:${FASTGEN_HOST_PORT:-8180}/epg.xml
#   Per-provider: /{id}.m3u and /{id}.xml (e.g. /lg.m3u)
# Behind edge TLS: https://gofast.example.com/playlist.m3u and …/epg.xml
#   (set FASTGEN_BASE_URL to that HTTPS origin; no trailing slash).
#
# Host access: `ports` publishes on the Docker host (e.g. http://host:8180/healthz).
# The `gofast` bridge is for container↔container DNS (edge → gen/proxy, or an
# external nginx attached with `docker network connect gofast …`).

name: gofast
services:
  gen:
    image: ghcr.io/j27-aurum/gofast/fastgen:${IMAGE_TAG:-latest}
    ports:
      - "${FASTGEN_HOST_PORT:-8180}:8180"
    volumes:
      # Default: named volume. For a host path, set FASTGEN_DATA=/mnt/.../gofast in stack.env
      - ${FASTGEN_DATA:-fastgen-data}:/data
    environment:
      PORT: "8180"
      # Public origin for logos/links (include :port unless 80/443). Example:
      # FASTGEN_BASE_URL: "http://192.168.1.50:8180"
      # FASTGEN_BASE_URL: "https://gofast.example.com"
      FASTGEN_BASE_URL: "${FASTGEN_BASE_URL:-}"
      # Public FASTProxy origin as reached by Jellyfin/ffmpeg.
      FASTGEN_PROXY_BASE_URL: "${FASTGEN_PROXY_BASE_URL:-}"
      # Gen-side probes rewrite public → this Docker-internal origin (service name: proxy).
      FASTGEN_PROXY_INTERNAL_URL: "${FASTGEN_PROXY_INTERNAL_URL:-http://proxy:8181}"
      FASTGEN_PROXY_ALL: "${FASTGEN_PROXY_ALL:-false}"
      FASTGEN_CACHE_LOGOS: "${FASTGEN_CACHE_LOGOS:-}"
    restart: unless-stopped
    networks:
      - gofast
    # fastgen is Debian + apt wget on PATH (not BusyBox /wget — that is proxy-only).
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8180/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  proxy:
    profiles:
      - proxy
    image: ghcr.io/j27-aurum/gofast/fastproxy:${IMAGE_TAG:-latest}
    depends_on:
      - gen
    ports:
      - "${FASTPROXY_HOST_PORT:-8181}:8181"
    environment:
      PORT: "8181"
      # Internal compose DNS — origin pull + telemetry push (not Jellyfin-facing).
      FASTPROXY_GEN_URL: "${FASTPROXY_GEN_URL:-http://gen:8180}"
      # Public HTTPS origin for playlist rewrite (same value as FASTGEN_PROXY_BASE_URL).
      FASTPROXY_PUBLIC_BASE_URL: "${FASTPROXY_PUBLIC_BASE_URL:-}"
    restart: unless-stopped
    networks:
      - gofast
    healthcheck:
      test: ["CMD", "/wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8181/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  edge:
    profiles:
      - edge
    image: nginx:1.27-alpine
    ports:
      - "${EDGE_HTTP_PORT:-80}:80"
      - "${EDGE_HTTPS_PORT:-443}:443"
    volumes:
      - ${EDGE_CONF:-./deploy/nginx/gofast.conf}:/etc/nginx/conf.d/default.conf:ro
      - ${EDGE_TLS_DIR:-./deploy/nginx/certs}:/etc/nginx/certs:ro
    depends_on:
      - gen
    restart: unless-stopped
    networks:
      - gofast

networks:
  gofast:
    driver: bridge

volumes:
  fastgen-data:
