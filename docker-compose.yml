services:
  fastgen:
    image: ghcr.io/j27-aurum/gofast/fastgen:latest
    build:
      context: .
      dockerfile: Dockerfile
      target: fastgen
    ports:
      - "8180:8180"
    volumes:
      # Local bind mount so generated artifacts are viewable in the repo (./cache).
      - ./cache:/data/cache
      # Seed providers for local smoke; override by replacing the file on the volume.
      - ./config.example.yaml:/data/config.yaml:ro
    environment:
      PORT: "8180"

  fastproxy:
    profiles:
      - proxy
    image: ghcr.io/j27-aurum/gofast/fastproxy:latest
    build:
      context: .
      dockerfile: Dockerfile
      target: fastproxy
    ports:
      - "8181:8181"
    environment:
      PORT: "8181"
