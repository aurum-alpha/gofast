# Local / dev compose (build from source).
#
# Host ports follow the app-wide port plan (~/Documents/Code/PORTS.md):
# gofast owns block 4600–4619 (GO → 4·6). fastgen :4600 (+0 ingress),
# fastproxy :4601 (+1). Override with FASTGEN_HOST_PORT / FASTPROXY_HOST_PORT.
#
# Jellyfin Live TV (gen-only) — see README:
#   Tuner M3U:  http://HOST:4600/playlist.m3u
#   Guide XMLTV: http://HOST:4600/epg.xml
#   Per-provider: /{id}.m3u and /{id}.xml
# Set FASTGEN_BASE_URL to the origin Jellyfin reaches (include :4600 unless
# behind TLS on 443). Optional proxy: docker compose --profile proxy up.

services:
  # One-shot: seed ./.data/config.yaml from config.example.yaml on first run so
  # local dev boots with all providers enabled. Prod does not use this — a fresh
  # /data with no file makes fastgen generate a defaults-only config (no
  # providers). Delete ./.data/config.yaml to re-seed.
  seed-config:
    image: busybox
    volumes:
      - ./config.example.yaml:/seed/config.example.yaml:ro
      - ./.data:/data
    command:
      - sh
      - -c
      - |
        if [ -f /data/config.yaml ]; then
          echo "seed-config: /data/config.yaml exists; leaving as-is"
        else
          cp /seed/config.example.yaml /data/config.yaml
          echo "seed-config: seeded /data/config.yaml from config.example.yaml"
        fi

  fastgen:
    image: ghcr.io/j27-aurum/gofast/fastgen:latest
    build:
      context: .
      dockerfile: Dockerfile
      target: fastgen
    depends_on:
      seed-config:
        condition: service_completed_successfully
    ports:
      - "${FASTGEN_HOST_PORT:-4600}:8180"
    volumes:
      # Single writable data volume (matches prod). fastgen owns /data:
      # generated artifacts under ./.data/cache, channel attrs under
      # ./.data/channelattr, and an operator-editable ./.data/config.yaml.
      # The seed-config service above copies config.example.yaml here on first
      # run; without it a fresh /data yields a defaults-only config (no
      # providers enabled), since every provider requires its own YAML block.
      - ./.data:/data
    environment:
      PORT: "8180"
      FASTGEN_PROXY_BASE_URL: "${FASTGEN_PROXY_BASE_URL:-}"
      # Gen-side health probes (Manual L2) — Docker DNS to the proxy service.
      # Keep FASTGEN_PROXY_BASE_URL as the Jellyfin/browser-facing origin (e.g. localhost:4601).
      FASTGEN_PROXY_INTERNAL_URL: "${FASTGEN_PROXY_INTERNAL_URL:-http://fastproxy:8181}"
      FASTGEN_PROXY_ALL: "${FASTGEN_PROXY_ALL:-false}"
      FASTGEN_BASE_URL: "${FASTGEN_BASE_URL:-}"
      # Leave empty by default so config.yaml cache_logos is not overridden
      # (env always wins when set). Export FASTGEN_CACHE_LOGOS=true|false to force.
      FASTGEN_CACHE_LOGOS: "${FASTGEN_CACHE_LOGOS:-}"

  fastproxy:
    profiles:
      - proxy
    image: ghcr.io/j27-aurum/gofast/fastproxy:latest
    build:
      context: .
      dockerfile: Dockerfile
      target: fastproxy
    depends_on:
      - fastgen
    ports:
      - "${FASTPROXY_HOST_PORT:-4601}:8181"
    environment:
      PORT: "8181"
      # Internal Docker DNS to gen for origin lookup + telemetry push.
      FASTPROXY_GEN_URL: "${FASTPROXY_GEN_URL:-http://fastgen:8180}"
      # Client-facing origin for rewritten /s and /seg URIs. Set behind TLS to
      # the same HTTPS value as FASTGEN_PROXY_BASE_URL; leave empty for local http.
      FASTPROXY_PUBLIC_BASE_URL: "${FASTPROXY_PUBLIC_BASE_URL:-http://localhost:4601}"
