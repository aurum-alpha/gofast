# Example / starter config for FASTGen.
# Copy to the data volume as /data/config.yaml (never commit a filled production copy).
#
# Deploy-varying values prefer env (see AGENTS.md / 12factor):
#   PORT, FASTGEN_BASE_URL, FASTGEN_DATA_DIR, FASTGEN_CONFIG,
#   FASTGEN_PROXY_BASE_URL, FASTGEN_PROXY_ALL, FASTGEN_CACHE_LOGOS,
#   FASTGEN_HEALTH_CONSECUTIVE_FAILURES, FASTGEN_HEALTH_EXCLUDE_UNHEALTHY,
#   FASTGEN_HEALTH_L1_INTERVAL, FASTGEN_HEALTH_L2_ENABLED, FASTGEN_HEALTH_FFPROBE_PATH
# Legacy FASTGEN_HEALTH_L2_INTERVAL and FASTGEN_HEALTH_L3_* aliases remain
# accepted for one release.
# Env always wins over this file for overlapping keys.
#
# Editing: the web UI's Config page edits most of this file as typed controls
# and applies changes LIVE (comment-preserving; a .bak of the prior file is
# kept). Hand-editing this file directly requires a container restart — the
# file is never watched. Env-set keys are locked in the UI (env wins).
# Restart-only settings (listen / data_dir) intentionally have no UI control.
# Secrets never live in this file — env only.
#
# base_url: public origin Jellyfin/browsers use for logos and absolute links.
# Include the port unless clients hit 80/443. No trailing slash.
# Prefer setting FASTGEN_BASE_URL in Portainer/stack.env for the deploy.

listen: ":8180"
# base_url: "http://192.168.1.50:8180"
# data_dir holds runtime data. fastgen generates its served artifacts under
# {data_dir}/cache (per-provider atomic generations containing raw/ plus
# playlist.m3u/guide.xml/meta.json, and combined playlist.m3u/epg.xml at the
# cache root). Put it on a persistent volume/bind mount so the last-known-good
# survives restarts and a fresh boot can restore without fetching upstream.
data_dir: /data

# Public FASTProxy origin as reached by Jellyfin/ffmpeg, not an internal-only
# container address. AMAGI_SSAI (Amagi rewrite) and SESSION (DAI mint) are
# filtered when this is unset. XUMO_SSAI emits upstream (keep ads.* — not Amagi
# rewrite). See docs/TERMINOLOGY.md.
# Set proxy_all to route every playable channel through the stable proxy URL;
# NATIVE remains direct by default.
# proxy_base_url: "http://192.168.1.50:8181"
#
# Optional gen-side probe origin when proxy_base_url is only client-reachable
# (e.g. http://localhost:8181). Manual L2 / scheduled probes rewrite EmittedURL
# from proxy_base_url → proxy_internal_url. Compose defaults this via
# FASTGEN_PROXY_INTERNAL_URL (http://fastproxy:8181 locally / http://proxy:8181 prod).
# Empty = probe the public base (fine when gen and clients share a network).
# proxy_internal_url: "http://fastproxy:8181"
#
# Separate from both: the proxy process itself needs FASTPROXY_GEN_URL
# (env on the fastproxy container, e.g. http://fastgen:8180) to pull channel
# origins and push telemetry into gen. That hop is Docker-internal; Jellyfin
# never uses it. Gen Status shows proxy activity from those pushes.
proxy_all: false

# When true, download logos to {data_dir}/cache/{provider}/logos and rewrite
# tvg-logo / XMLTV <icon> / API logo_url to {base_url}/logos/... . Requires
# base_url / FASTGEN_BASE_URL. When false, leave upstream CDN URLs unchanged.
# Prefer FASTGEN_CACHE_LOGOS in Portainer/stack.env for the deploy.
cache_logos: false

# Artwork-only TLS exceptions (never used by stream/EPG clients).
# Only relevant when cache_logos is true.
artwork_tls:
   tvpnlogopus.samsungcloud.tv:
     # ca_pem: |
     #   -----BEGIN CERTIFICATE-----
     #   ...
     insecure_skip_verify: true   # last resort

timeouts:
  http_client: 60s

logging:
  level: info

# Channel health FSM + probes (attr store is separate — see internal/channelattr).
# Prefer FASTGEN_HEALTH_* env vars in Portainer/stack.env for the deploy.
health:
  consecutive_failures: 3
  # When true, HealthDown channels are pruned from M3U/XMLTV (causes Jellyfin lineup churn).
  exclude_unhealthy: false
  # Health L1: daily segment GET for NATIVE / XUMO_SSAI, and AMAGI_SSAI when
  # EmittedURL (proxy) is set. Not SESSION. Prefer Range; retry plain GET on 416.
  l1_interval: 24h
  l1_workers: 4
  # Soft-retry timeout/5xx once before counting a hard failure (0 disables).
  soft_retries: 1
  # Cap concurrent Health L1/L2 probes per CDN hostname.
  max_per_host: 2
  # Health L2: ffprobe — OFF by default (bot-fingerprint / ad-impression tradeoff).
  l2_enabled: false
  l2_interval: 60m
  l2_workers: 2
  l2_timeout: 30s
  # When Health L2 is on: always probe degraded/down/untested; sample this fraction of healthy (1.0 = all).
  l2_healthy_sample: 0.1
  # Migration: old l2_interval/l2_workers (Health L1) and l3_* (Health L2)
  # aliases are accepted for one release when the corresponding new keys are unset.
  ffprobe_path: /usr/bin/ffprobe

# Cross-provider group taxonomy (J27-47). Optional and app-managed: the Groups
# editor in the UI writes this block back to config.yaml (comments preserved).
# When enabled, the "{label}: {group}" prefix is dropped so identical upstream
# group strings auto-merge into one Jellyfin folder; use `merges` to fold
# differently-named upstream groups (NEWS vs News & Info) into one canonical
# name, and `disabled` to drop a group's channels from export (they stay visible
# in the UI with a "disabled group" reason). Match is trim + case-insensitive.
# Omit the block (or set enabled: false) for the legacy per-provider grouping.
# Starter merges fold common upstream synonyms across providers into ~25 folders.
# Edit in the UI Groups page or here; disable selectors still work via `disabled`.
groups:
  enabled: true
  merges:
    - name: News
      members: [News, "News & Opinion", "News + Opinion", "News And Opinion", "Breaking News"]
