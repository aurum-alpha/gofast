name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}
  # Keep in sync with Dockerfile / Dockerfile.prod image pins.
  NODE_IMAGE: node:22-bookworm
  GO_IMAGE: golang:1.23-bookworm

jobs:
  compile:
    name: Compile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build UI
        run: |
          docker run --rm \
            -v "$PWD:/src" -w /src/web \
            ${{ env.NODE_IMAGE }} \
            bash -c 'npm ci && mkdir -p /src/internal/ui && npm run build'

      - name: Compile binaries
        run: |
          mkdir -p bin
          docker run --rm \
            -v "$PWD:/src" -w /src \
            -e CGO_ENABLED=0 \
            ${{ env.GO_IMAGE }} \
            bash -c 'go build -trimpath -ldflags="-s -w" -o bin/fastgen ./cmd/fastgen && go build -trimpath -ldflags="-s -w" -o bin/fastproxy ./cmd/fastproxy'
          chmod 755 bin/fastgen bin/fastproxy

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: go-binaries
          path: bin/
          retention-days: 1

  test:
    name: Test
    needs: compile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build UI
        run: |
          docker run --rm \
            -v "$PWD:/src" -w /src/web \
            ${{ env.NODE_IMAGE }} \
            bash -c 'npm ci && mkdir -p /src/internal/ui && npm run build'

      - name: Test
        run: |
          docker run --rm \
            -v "$PWD:/src" -w /src \
            -e CGO_ENABLED=0 \
            ${{ env.GO_IMAGE }} \
            bash -c 'go test ./...'

  docker:
    name: Docker
    needs: [compile, test]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: fastgen
            image_suffix: fastgen
          - target: fastproxy
            image_suffix: fastproxy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: go-binaries
          path: bin/

      - name: Restore execute bit
        run: chmod 755 bin/fastgen bin/fastproxy

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.image_suffix }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=ref,event=branch

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.prod
          target: ${{ matrix.target }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
