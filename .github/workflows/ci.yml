name: Go

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true

      - name: Build
        run: |
          go build -trimpath -o /tmp/fastgen ./cmd/fastgen
          go build -trimpath -o /tmp/fastproxy ./cmd/fastproxy

      - name: Test
        run: go test ./...
