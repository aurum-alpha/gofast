name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  # The shared node jobs request packages: read so private @aurum-alpha
  # packages resolve. A called workflow can never hold more than the calling
  # job, and naming any scope here sets every unnamed one to none — so
  # omitting this rejects the whole file at startup, before any job runs.
  packages: read

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}
  # Node comes from client/.node-version (beside the app it pins, which is where
  # the shared node jobs look); Go comes from go.mod (go-version-file), which
  # aligns with the Dockerfile pin.

# Cancel superseded pull-request runs, never the default branch: a main run
# can publish, and cancelling it drops the publish silently — a cancelled run
# is not a failed one, so the rollup stays green and the artifact simply never
# appears (CI_STANDARD Principle 6).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  server-go-mod:
    uses: aurum-alpha/workflows/.github/workflows/job-go-mod.yml@027a84a487c3513266ca98014988eb0a9088b35c # v1.7.0
    secrets: inherit

  # The React app builds the same way as every other one in the fleet. workdir
  # is `client` because this repo is the second shape: the JS project lives
  # inside a Go tree with its own package.json, lockfile and .node-version.
  client-ts-react-build:
    uses: aurum-alpha/workflows/.github/workflows/job-build-js-vite.yml@fecc8e7a428dadb73acb80544cc8d74d873f260a # v1.11.0
    with:
      workdir: client
      outdir: dist
    secrets: inherit

  server-go-build:
    needs: server-go-mod
    runs-on: ${{ vars.RUNNER || 'ubuntu-26.04' }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binaries
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./scripts/build.sh

      - name: Upload binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: go-binaries
          path: bin/
          retention-days: 1

  server-go-fmt:
    needs: server-go-build
    uses: aurum-alpha/workflows/.github/workflows/job-go-fmt.yml@027a84a487c3513266ca98014988eb0a9088b35c # v1.7.0
    secrets: inherit

  server-go-vet:
    needs: server-go-build
    uses: aurum-alpha/workflows/.github/workflows/job-go-vet.yml@027a84a487c3513266ca98014988eb0a9088b35c # v1.7.0
    secrets: inherit

  server-go-test-unit:
    needs: server-go-build
    uses: aurum-alpha/workflows/.github/workflows/job-go-test-unit.yml@027a84a487c3513266ca98014988eb0a9088b35c # v1.7.0
    secrets: inherit

  # The id names the codebase it acts on: this lints the React app, not the Go
  # code. A bare `lint` would read as the Go linter it is not.
  # oxlint, not eslint. They are not interchangeable — oxlint has no type-aware
  # rules at all — and both jobs exist so this repo is not blocked on a linter
  # migration nobody asked for (CI_STANDARD "Two linters, on purpose, for now").
  client-ts-react-lint:
    needs: client-ts-react-build
    uses: aurum-alpha/workflows/.github/workflows/job-lint-js-oxlint.yml@fecc8e7a428dadb73acb80544cc8d74d873f260a # v1.11.0
    with:
      workdir: client
      dir: "."
      # 4 pre-existing react-hooks(exhaustive-deps) warnings. Today's `pnpm lint`
      # runs bare oxlint and tolerates them; --deny-warnings does not.
      # Stabilization window, not a mode.
      warn_only: true
    secrets: inherit

  # Was folded into the client build as `tsc -b && vite build`, so a type error
  # read as a build failure. `-b` because this client uses project references:
  # without build mode tsc has no inputs and exits 0 having checked nothing.
  client-ts-react-typecheck:
    needs: client-ts-react-build
    uses: aurum-alpha/workflows/.github/workflows/job-typecheck-ts-tsc.yml@fecc8e7a428dadb73acb80544cc8d74d873f260a # v1.11.0
    with:
      workdir: client
    secrets: inherit

  # No tests here yet. The job exists so the absence is visible on every run
  # rather than inferred from a job that is not there (CI_STANDARD F3).
  client-ts-react-test-unit:
    needs: client-ts-react-build
    uses: aurum-alpha/workflows/.github/workflows/job-test-unit-js-vitest.yml@fecc8e7a428dadb73acb80544cc8d74d873f260a # v1.11.0
    with:
      workdir: client
      dir: "."
    secrets: inherit

  image:
    needs:
      - server-go-build
      - server-go-fmt
      - server-go-vet
      - server-go-test-unit
      - client-ts-react-build
      - client-ts-react-lint
      - client-ts-react-typecheck
      - client-ts-react-test-unit
    runs-on: ${{ vars.RUNNER || 'ubuntu-26.04' }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: fastgen
            image_suffix: fastgen
          - target: fastproxy
            image_suffix: fastproxy
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Download binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: go-binaries
          path: bin/

      # fastgen serves the React app from files in the image, so Dockerfile.prod
      # packages this alongside the binary.
      - name: Download UI dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: client-dist
          path: client/dist/

      - name: Restore execute bit
        run: chmod 755 bin/fastgen bin/fastproxy

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.image_suffix }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=build-${{ github.run_number }},enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=ref,event=branch

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile.prod
          target: ${{ matrix.target }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  ci-ok:
    needs:
      - server-go-mod
      - server-go-build
      - server-go-fmt
      - server-go-vet
      - server-go-test-unit
      - client-ts-react-build
      - client-ts-react-lint
      - client-ts-react-typecheck
      - client-ts-react-test-unit
      - image
    if: always()
    runs-on: ${{ vars.RUNNER || 'ubuntu-26.04' }}
    timeout-minutes: 30
    permissions: {}
    steps:
      - name: Fail on failed or cancelled dependencies
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
