name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  # The shared node jobs request packages: read so private @aurum-alpha
  # packages resolve. A called workflow can never hold more than the calling
  # job, and naming any scope here sets every unnamed one to none — so
  # omitting this rejects the whole file at startup, before any job runs.
  packages: read

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}
  # Node comes from client/.node-version (beside the app it pins, which is where
  # the shared node jobs look); Go comes from go.mod (go-version-file), which
  # aligns with the Dockerfile pin.

# Cancel superseded pull-request runs, never the default branch: a main run
# can publish, and cancelling it drops the publish silently — a cancelled run
# is not a failed one, so the rollup stays green and the artifact simply never
# appears (CI_STANDARD Principle 6).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # The caller-side checkers in the catalog — conformance, thinness,
  # permissions and toolchain versions — run against this repo the way they
  # run against the other eight (aurum-alpha/workflows#79). gofast was the
  # last repo that passes all four and was not running them, which is the
  # worst combination: conformant today, with nothing that would say so on
  # the day it stops being.
  #
  # No needs:. It reads ci.yml, go.mod and package.json, never a build
  # output, so a broken build makes its verdict no less true — and gating it
  # would mean the repo least likely to be conformant is the one that never
  # finds out. Rule D1 exempts it on exactly that ground.
  #
  # In ci-ok, because a check outside the rollup is a check nobody has to pass.
  ci-conformance:
    permissions:
      contents: read
    uses: aurum-alpha/workflows/.github/workflows/job-ci-conformance.yml@e0f3597552a0553dc4ca0c9d4e4a4cbe91a8786d # v1.28.0
    secrets: inherit

  server-go-mod:
    uses: aurum-alpha/workflows/.github/workflows/job-go-mod.yml@e0f3597552a0553dc4ca0c9d4e4a4cbe91a8786d # v1.28.0
    secrets: inherit

  # The React app builds the same way as every other one in the fleet. workdir
  # is `client` because this repo is the second shape: the JS project lives
  # inside a Go tree with its own package.json, lockfile and .node-version.
  client-ts-react-build:
    uses: aurum-alpha/workflows/.github/workflows/job-build-js-vite.yml@e0f3597552a0553dc4ca0c9d4e4a4cbe91a8786d # v1.28.0
    with:
      workdir: client
      outdir: dist
    secrets: inherit

  # One build job per binary, because this repo tracks per-image build success
  # and a binary is the same kind of claim: `server-go-fastgen-build` red says
  # which deployable unit failed to link, where one job named `server-go-build`
  # said only that something did.
  #
  # Each links exactly one binary and uploads only that one, so each image job
  # downloads only what it ships. The single go-binaries artifact used to go to
  # both, which put bin/fastgen in fastproxy's build context and made both
  # image jobs chmod a binary neither of them needed.
  #
  # Build is still github.run_number; the shared job reads it from the
  # environment rather than the caller passing it, so every Go repo in the
  # fleet stamps the same four fields whether or not it remembered to.
  server-go-fastgen-build:
    permissions:
      contents: read
    needs: server-go-mod
    uses: aurum-alpha/workflows/.github/workflows/job-go-build.yml@e0f3597552a0553dc4ca0c9d4e4a4cbe91a8786d # v1.28.0
    with:
      binaries: '["fastgen"]'
      # Explicit, not inherited. Passing neither made job-go-build target the
      # runner's own platform and name the output plainly, so the artifact
      # recorded nothing about what it was built for. The suffix is the fix.
      goos: linux
      goarches: '["amd64","arm64"]'
      artifact_name: go-binary-fastgen
    secrets: inherit

  server-go-fastproxy-build:
    permissions:
      contents: read
    needs: server-go-mod
    uses: aurum-alpha/workflows/.github/workflows/job-go-build.yml@e0f3597552a0553dc4ca0c9d4e4a4cbe91a8786d # v1.28.0
    with:
      binaries: '["fastproxy"]'
      # Explicit, not inherited. Passing neither made job-go-build target the
      # runner's own platform and name the output plainly, so the artifact
      # recorded nothing about what it was built for. The suffix is the fix.
      goos: linux
      goarches: '["amd64","arm64"]'
      artifact_name: go-binary-fastproxy
    secrets: inherit

  # Lockfile scanning, and it is not a Go job — it reads go.mod AND
  # client/pnpm-lock.yaml, which is why it sits in the catalog language-neutral
  # rather than beside the Go gates by accident of where it was written.
  #
  # Not a duplicate of govulncheck below. That one is Go-only and call-graph
  # aware, so it answers "is the vulnerable code reachable". This one is
  # lockfile-based and cross-ecosystem, so it answers "is a known-bad version
  # in the tree at all" — and until it existed nothing in this repo looked at
  # the pnpm side.
  #
  # A standard gate, so it hangs off the builds with the rest of them.
  osv-scanner:
    needs: [server-go-fastgen-build, server-go-fastproxy-build]
    # The catalog wraps it now, and the wrapper picks the upstream workflow by
    # event: a pull request is scanned against its base and blocked by what it
    # INTRODUCES, while a push scans the whole tree. Calling
    # osv-scanner-reusable.yml on both — which this did — judged a pull request
    # against the entire backlog, so the only lever that stopped that blocking
    # unrelated work also stopped it blocking a newly added vulnerability. See
    # CI_STANDARD, "The catalog wraps it, and only because the event decides
    # the workflow".
    #
    # Declared, not inherited, and wider than it looks: actions: read and
    # security-events: write are what the upstream job asks for, and it asks
    # whether or not the SARIF upload actually runs.
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: aurum-alpha/workflows/.github/workflows/job-osv-scan.yml@e0f3597552a0553dc4ca0c9d4e4a4cbe91a8786d # v1.28.0
    with:
      # NOT the wrapper default, and the difference matters. fail_on_existing
      # defaults false because most repos here carry a backlog; gofast does
      # not. It was already blocking on the whole tree with fail-on-vuln:
      # true, so taking the default would have WEAKENED a working gate as a
      # side effect of a migration that is supposed to be behaviour-preserving.
      # What is accepted is accepted by id in osv-scanner.toml, where the
      # reason sits beside the dependency it excuses.
      fail_on_existing: true
      # fail_on_new is left at its default, true. Nothing to say: a pull
      # request that adds a vulnerability should fail, and this repo is at
      # zero, so the two gates agree today.
      #
      # upload_sarif is left at its default, true. This repo is the canary for
      # that default across the fleet — public, at zero findings, so if the
      # upload is refused or collides with CodeQL default setup, it fails here
      # where there is no backlog to confuse the reading.
      #
      # runner is left empty: the wrapper resolves vars.RUNNER itself.
      #
      # Named, never discovered. The upstream default is a recursive walk;
      # a scan that finds its own inputs stops covering a file the day it
      # moves and reports the same clean result either way. A named lockfile
      # that is missing exits 127 and writes no report, which fails the job.
      scan-args: |-
        --lockfile=./go.mod
        --lockfile=./client/pnpm-lock.yaml

  server-go-fmt:
    needs: [server-go-fastgen-build, server-go-fastproxy-build]
    uses: aurum-alpha/workflows/.github/workflows/job-go-fmt.yml@e0f3597552a0553dc4ca0c9d4e4a4cbe91a8786d # v1.28.0
    secrets: inherit

  server-go-vet:
    needs: [server-go-fastgen-build, server-go-fastproxy-build]
    uses: aurum-alpha/workflows/.github/workflows/job-go-vet.yml@e0f3597552a0553dc4ca0c9d4e4a4cbe91a8786d # v1.28.0
    secrets: inherit

  server-go-test-unit:
    needs: [server-go-fastgen-build, server-go-fastproxy-build]
    uses: aurum-alpha/workflows/.github/workflows/job-go-test-unit.yml@e0f3597552a0553dc4ca0c9d4e4a4cbe91a8786d # v1.28.0
    secrets: inherit

  # The id names the codebase it acts on: this lints the React app, not the Go
  # code. A bare `lint` would read as the Go linter it is not.
  # oxlint, not eslint. They are not interchangeable — oxlint has no type-aware
  # rules at all — and both jobs exist so this repo is not blocked on a linter
  # migration nobody asked for (CI_STANDARD "Two linters, on purpose, for now").
  # Two linters, named the way the Go side already names its four: the id says
  # which tool, so a red check points at a tool rather than at "lint".
  # oxlint runs the fast syntactic subset; eslint does the type-aware work
  # oxlint cannot (CI_STANDARD "Two linters, on purpose, for now").
  client-ts-react-lint-oxlint:
    needs: client-ts-react-build
    uses: aurum-alpha/workflows/.github/workflows/job-lint-js-oxlint.yml@e0f3597552a0553dc4ca0c9d4e4a4cbe91a8786d # v1.28.0
    with:
      workdir: client
      dir: "."
      # 4 pre-existing react-hooks(exhaustive-deps) warnings. Today's `pnpm lint`
      # runs bare oxlint and tolerates them; --deny-warnings does not.
      # Stabilization window, not a mode.
      warn_only: true
    secrets: inherit

  client-ts-react-lint-eslint:
    needs: client-ts-react-build
    uses: aurum-alpha/workflows/.github/workflows/job-lint-js-eslint.yml@e0f3597552a0553dc4ca0c9d4e4a4cbe91a8786d # v1.28.0
    with:
      workdir: client
      dir: "."
      # 17 errors, all real: react-hooks/set-state-in-effect x9,
      # no-misused-promises x5, no-floating-promises, react-hooks/purity x2.
      # No `any` debt at all — the cleanest client in the fleet. Warn while
      # those are fixed, then flip this off (CI_STANDARD Principle 3).
      warn_only: true
    secrets: inherit

  # Was folded into the client build as `tsc -b && vite build`, so a type error
  # read as a build failure. `-b` because this client uses project references:
  # without build mode tsc has no inputs and exits 0 having checked nothing.
  client-ts-react-typecheck:
    needs: client-ts-react-build
    uses: aurum-alpha/workflows/.github/workflows/job-typecheck-ts-tsc.yml@e0f3597552a0553dc4ca0c9d4e4a4cbe91a8786d # v1.28.0
    with:
      workdir: client
    secrets: inherit

  # No tests here yet. The job exists so the absence is visible on every run
  # rather than inferred from a job that is not there (CI_STANDARD F3).
  client-ts-react-test-unit:
    needs: client-ts-react-build
    uses: aurum-alpha/workflows/.github/workflows/job-test-unit-js-vitest.yml@e0f3597552a0553dc4ca0c9d4e4a4cbe91a8786d # v1.28.0
    with:
      workdir: client
      dir: "."
    secrets: inherit

  server-go-lint-errcheck:
    needs: [server-go-fastgen-build, server-go-fastproxy-build]
    uses: aurum-alpha/workflows/.github/workflows/job-go-lint.yml@e0f3597552a0553dc4ca0c9d4e4a4cbe91a8786d # v1.28.0
    with:
      linter: errcheck
      # 41 pre-existing finding(s). Stabilization window, not a mode —
      # the gate goes hard when the debt is gone.
      warn_only: true
    secrets: inherit

  server-go-lint-staticcheck:
    needs: [server-go-fastgen-build, server-go-fastproxy-build]
    uses: aurum-alpha/workflows/.github/workflows/job-go-lint.yml@e0f3597552a0553dc4ca0c9d4e4a4cbe91a8786d # v1.28.0
    with:
      linter: staticcheck
      # 17 pre-existing finding(s). Stabilization window, not a mode —
      # the gate goes hard when the debt is gone.
      warn_only: true
    secrets: inherit

  server-go-lint-ineffassign:
    needs: [server-go-fastgen-build, server-go-fastproxy-build]
    uses: aurum-alpha/workflows/.github/workflows/job-go-lint.yml@e0f3597552a0553dc4ca0c9d4e4a4cbe91a8786d # v1.28.0
    with:
      linter: ineffassign
      # 1 pre-existing finding(s). Stabilization window, not a mode —
      # the gate goes hard when the debt is gone.
      warn_only: true
    secrets: inherit

  server-go-lint-unused:
    needs: [server-go-fastgen-build, server-go-fastproxy-build]
    uses: aurum-alpha/workflows/.github/workflows/job-go-lint.yml@e0f3597552a0553dc4ca0c9d4e4a4cbe91a8786d # v1.28.0
    with:
      linter: unused
      # 1 pre-existing finding(s). Stabilization window, not a mode —
      # the gate goes hard when the debt is gone.
      warn_only: true
    secrets: inherit

  # Lifted out of client-manager's tools/checks/govulncheck: a vulnerability
  # scan is not one repo's concern (CI_STANDARD Principle 19).
  server-go-govulncheck:
    needs: [server-go-fastgen-build, server-go-fastproxy-build]
    uses: aurum-alpha/workflows/.github/workflows/job-go-govulncheck.yml@e0f3597552a0553dc4ca0c9d4e4a4cbe91a8786d # v1.28.0
    secrets: inherit

  # Two images, two jobs. A matrix collapses them into one entry that reports as
  # `image (fastgen, fastgen)`, so a reader cannot tell from the checks list what
  # was built or which half failed — and both share a single set of needs even
  # though only one carries the UI. Named jobs cost a few lines and make the DAG
  # legible (CI_STANDARD "Job ids name the deployable unit").
  #
  # fastgen serves the React app from files in the image, so it is the one that
  # consumes client-dist. fastproxy carries no UI at all — which is exactly how
  # the Dockerfile.prod path error localised itself when fastgen failed and
  # fastproxy passed.
  # fastgen: build, start, publish, prune — four claims, four checks.
  # One job used to do all of it and reported as `server-go-fastgen-image`, so a
  # red run named the image and not which claim about it failed.
  server-go-fastgen-image-build:
    needs:
      - server-go-fastgen-build
      - server-go-fmt
      - server-go-vet
      - server-go-test-unit
      - client-ts-react-build
      - client-ts-react-lint-oxlint
      - client-ts-react-lint-eslint
      - client-ts-react-typecheck
      - client-ts-react-test-unit
      - server-go-lint-errcheck
      - server-go-lint-staticcheck
      - server-go-lint-ineffassign
      - server-go-lint-unused
      - server-go-govulncheck
    permissions:
      contents: read
      packages: write
    uses: aurum-alpha/workflows/.github/workflows/job-image-build.yml@e0f3597552a0553dc4ca0c9d4e4a4cbe91a8786d # v1.28.0
    with:
      # A name under the owner: ghcr.io/aurum-alpha/gofast/fastgen, which is what
      # IMAGE_PREFIX built by hand.
      image_name: gofast/fastgen
      dockerfile: Dockerfile.prod
      target: fastgen
      # Both, explicitly. The apt-get in this stage runs under QEMU for arm64
      # and is the slow part of the build (workflows#158); stated here so what
      # this image ships is visible at the call site.
      platforms: linux/amd64,linux/arm64
      # fastgen serves the React app from files in the image, so it is the
      # one that consumes client-dist.
      # client/dist is architecture-independent, so it maps once and serves
      # both platforms; only the Go binary needs one artifact per arch.
      artifacts: |
        go-binary-fastgen-amd64=bin
        go-binary-fastgen-arm64=bin
        client-dist=client/dist
      # Artifact upload drops the execute bit, so the image builds
      # cleanly and the container dies on exec.
      executables: |
        bin/fastgen-linux-amd64
        bin/fastgen-linux-arm64
    secrets: inherit

  # probe: health — Dockerfile.prod declares a HEALTHCHECK for this target, so
  # the image states its own readiness contract and this waits for Docker's
  # verdict instead of inventing a second one.
  server-go-fastgen-image-starts:
    needs: [server-go-fastgen-image-build]
    permissions:
      contents: read
      packages: read
    uses: aurum-alpha/workflows/.github/workflows/job-image-starts.yml@e0f3597552a0553dc4ca0c9d4e4a4cbe91a8786d # v1.28.0
    with:
      image: ${{ needs.server-go-fastgen-image-build.outputs.image }}
      digest: ${{ needs.server-go-fastgen-image-build.outputs.digest }}
      probe: health
      # config.DefaultPath is /data/config.yaml, and cache, clientaccess,
      # proxyactivity and channelattr all open under /data — each os.Exit(1)
      # on failure. A tmpfs is the same dependency without the cleanup;
      # mode 1777 because the image runs as nonroot (uid 65532).
      start_mounts: |
        /data=1777
    secrets: inherit

  server-go-fastgen-image-publish:
    needs: [server-go-fastgen-image-build, server-go-fastgen-image-starts]
    permissions:
      contents: read
      packages: write
    uses: aurum-alpha/workflows/.github/workflows/job-image-publish.yml@e0f3597552a0553dc4ca0c9d4e4a4cbe91a8786d # v1.28.0
    with:
      image: ${{ needs.server-go-fastgen-image-build.outputs.image }}
      digest: ${{ needs.server-go-fastgen-image-build.outputs.digest }}
      # This repo has always stamped the run number alongside latest.
      extra_tags: |
        type=raw,value=build-${{ github.run_number }},enable={{is_default_branch}}
    secrets: inherit

  # fastproxy: build, start, publish, prune — four claims, four checks.
  # One job used to do all of it and reported as `server-go-fastproxy-image`, so a
  # red run named the image and not which claim about it failed.
  server-go-fastproxy-image-build:
    needs:
      - server-go-fastproxy-build
      - server-go-fmt
      - server-go-vet
      - server-go-test-unit
      - server-go-lint-errcheck
      - server-go-lint-staticcheck
      - server-go-lint-ineffassign
      - server-go-lint-unused
      - server-go-govulncheck
    permissions:
      contents: read
      packages: write
    uses: aurum-alpha/workflows/.github/workflows/job-image-build.yml@e0f3597552a0553dc4ca0c9d4e4a4cbe91a8786d # v1.28.0
    with:
      # A name under the owner: ghcr.io/aurum-alpha/gofast/fastproxy, which is what
      # IMAGE_PREFIX built by hand.
      image_name: gofast/fastproxy
      dockerfile: Dockerfile.prod
      target: fastproxy
      # Both, explicitly. The apt-get in this stage runs under QEMU for arm64
      # and is the slow part of the build (workflows#158); stated here so what
      # this image ships is visible at the call site.
      platforms: linux/amd64,linux/arm64
      # fastproxy carries no UI at all — which is how the Dockerfile.prod path
      # error localised itself when fastgen failed and fastproxy passed.
      artifacts: |
        go-binary-fastproxy-amd64=bin
        go-binary-fastproxy-arm64=bin
      # Artifact upload drops the execute bit, so the image builds
      # cleanly and the container dies on exec.
      executables: |
        bin/fastproxy-linux-amd64
        bin/fastproxy-linux-arm64
    secrets: inherit

  # probe: health — Dockerfile.prod declares a HEALTHCHECK for this target, so
  # the image states its own readiness contract and this waits for Docker's
  # verdict instead of inventing a second one.
  server-go-fastproxy-image-starts:
    needs: [server-go-fastproxy-image-build]
    permissions:
      contents: read
      packages: read
    uses: aurum-alpha/workflows/.github/workflows/job-image-starts.yml@e0f3597552a0553dc4ca0c9d4e4a4cbe91a8786d # v1.28.0
    with:
      image: ${{ needs.server-go-fastproxy-image-build.outputs.image }}
      digest: ${{ needs.server-go-fastproxy-image-build.outputs.digest }}
      probe: health
      # HealthzHandler answers ok:true without reaching gen, so an
      # unreachable URL is enough to prove this image boots. Whether it can
      # actually reach fastgen is an integration question, not this job's.
      start_env: |
        FASTPROXY_GEN_URL=http://127.0.0.1:8180
    secrets: inherit

  server-go-fastproxy-image-publish:
    needs: [server-go-fastproxy-image-build, server-go-fastproxy-image-starts]
    permissions:
      contents: read
      packages: write
    uses: aurum-alpha/workflows/.github/workflows/job-image-publish.yml@e0f3597552a0553dc4ca0c9d4e4a4cbe91a8786d # v1.28.0
    with:
      image: ${{ needs.server-go-fastproxy-image-build.outputs.image }}
      digest: ${{ needs.server-go-fastproxy-image-build.outputs.digest }}
      # This repo has always stamped the run number alongside latest.
      extra_tags: |
        type=raw,value=build-${{ github.run_number }},enable={{is_default_branch}}
    secrets: inherit

  # Codecov, once, for the whole run. NOT in any build or image job's needs,
  # and that is the point of it existing. The upload used to happen inside each
  # test-unit job, so a test-unit job reported one conclusion for two unrelated
  # questions: did the tests pass, and did a third-party service accept an HTTP
  # POST. Everything gated on test-unit was therefore gated on Codecov being
  # reachable. On 2026-08-21 the Dependabot secret store had no CODECOV_TOKEN,
  # every private repo's Dependabot runs went red on the upload, and the image
  # jobs were SKIPPED in all of them with nothing wrong with the code.
  #
  # So it hangs off the test jobs, reports into ci-ok, and has nothing
  # downstream. A Codecov outage turns one job red and leaves the rest running.
  coverage-upload:
    # !cancelled(), for the reason the prune carries the same condition: a job
    # whose `if:` omits it is also gated on success(), so one failed unit would
    # skip this entirely — losing the other units' coverage and the failed
    # unit's test results, which are exactly the run Codecov's test analytics
    # wants. A failed unit publishes no coverage of its own; the collector finds
    # one artifact fewer and says so.
    if: ${{ !cancelled() }}
    needs:
      - server-go-test-unit
      - client-ts-react-test-unit
    # Narrower than the file-level floor: this job reads artifacts and the tree,
    # never the private registry.
    permissions:
      contents: read
    uses: aurum-alpha/workflows/.github/workflows/job-coverage-upload.yml@e0f3597552a0553dc4ca0c9d4e4a4cbe91a8786d # v1.28.0
    secrets: inherit

  ci-ok:
    needs:
      - coverage-upload
      - ci-conformance
      - osv-scanner
      - server-go-mod
      - server-go-fastgen-build
      - server-go-fastproxy-build
      - server-go-fmt
      - server-go-vet
      - server-go-test-unit
      - client-ts-react-build
      - client-ts-react-lint-oxlint
      - client-ts-react-lint-eslint
      - client-ts-react-typecheck
      - client-ts-react-test-unit
      - server-go-lint-errcheck
      - server-go-lint-staticcheck
      - server-go-lint-ineffassign
      - server-go-lint-unused
      - server-go-govulncheck
      - server-go-fastgen-image-build
      - server-go-fastgen-image-starts
      - server-go-fastgen-image-publish
      - server-go-fastproxy-image-build
      - server-go-fastproxy-image-starts
      - server-go-fastproxy-image-publish
    if: always()
    runs-on: ${{ vars.RUNNER || 'ubuntu-26.04' }}
    timeout-minutes: 30
    permissions: {}
    steps:
      # The needs: list above is this repo's DAG and stays here. The lines that
      # decide what a red rollup means are shared: this repo carried its own
      # longer variant, which is precisely the drift the action ends.
      - uses: aurum-alpha/workflows/.github/actions/ci-ok@e0f3597552a0553dc4ca0c9d4e4a4cbe91a8786d # v1.28.0
        with:
          needs_json: ${{ toJSON(needs) }}

  # Housekeeping, outside the rollup and downstream of it. Two images, two
  # packages, two prunes — each sweeps only its own.
  #
  # Live. Every dry run in the fleet reported the same two things: the
  # reference analysis holds — jewelry-factory protected 111 of 120 digests,
  # index children included — and nothing untagged had yet reached 30 days,
  # so there was nothing to sweep. The age threshold is what protects a live
  # image, not the dry run: `imagetools create` leaves the PROMOTED digest
  # untagged, so an untagged-only sweep would delete what :latest resolves
  # to. This job walks index children, and deletes nothing at all if it
  # cannot inspect a tag.
  server-go-fastgen-image-prune:
    # !cancelled(), not a bare condition. A job whose `if:` omits it is also
    # gated on success(), and a SKIPPED ancestor — not a failed one — is enough
    # to suppress it. The skip reaches here through ci-ok, even though ci-ok
    # itself survives on always() and reports success, so nothing goes red and
    # the housekeeping simply stops. event-manager proved it: test-e2e sat at
    # `if: false` and this job never dispatched across three consecutive merges
    # to main, staging a manifest into a registry with no TTL each time.
    if: ${{ !cancelled() && github.event_name == 'push'
        && github.ref == 'refs/heads/main' }}
    needs: [ci-ok]
    permissions:
      contents: read
      packages: write
    uses: aurum-alpha/workflows/.github/workflows/job-image-prune.yml@e0f3597552a0553dc4ca0c9d4e4a4cbe91a8786d # v1.28.0
    with:
      image_name: gofast/fastgen
    secrets: inherit

