name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  # The shared node jobs request packages: read so private @aurum-alpha
  # packages resolve. A called workflow can never hold more than the calling
  # job, and naming any scope here sets every unnamed one to none — so
  # omitting this rejects the whole file at startup, before any job runs.
  packages: read

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}
  # Node comes from web/.node-version (beside the app it pins, which is where
  # the shared node jobs look); Go comes from go.mod (go-version-file), which
  # aligns with the Dockerfile pin.

# Cancel superseded pull-request runs, never the default branch: a main run
# can publish, and cancelling it drops the publish silently — a cancelled run
# is not a failed one, so the rollup stays green and the artifact simply never
# appears (CI_STANDARD Principle 6).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  go-mod:
    uses: aurum-alpha/workflows/.github/workflows/job-go-mod.yml@03728a3d8bd5fc6de8ef4c76671885bd965473be # v1.6.0
    secrets: inherit

  # The React app builds the same way as every other one in the fleet.
  web-build:
    uses: aurum-alpha/workflows/.github/workflows/job-node-build.yml@03728a3d8bd5fc6de8ef4c76671885bd965473be # v1.6.0
    with:
      workdir: web
    secrets: inherit

  build:
    name: build
    needs: go-mod
    runs-on: ${{ vars.RUNNER || 'ubuntu-26.04' }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binaries
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./scripts/build.sh

      - name: Upload binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: go-binaries
          path: bin/
          retention-days: 1

  gofmt:
    needs: build
    uses: aurum-alpha/workflows/.github/workflows/job-go-gofmt.yml@03728a3d8bd5fc6de8ef4c76671885bd965473be # v1.6.0
    secrets: inherit

  vet:
    needs: build
    uses: aurum-alpha/workflows/.github/workflows/job-go-vet.yml@03728a3d8bd5fc6de8ef4c76671885bd965473be # v1.6.0
    secrets: inherit

  test-unit:
    needs: build
    uses: aurum-alpha/workflows/.github/workflows/job-go-test-unit.yml@03728a3d8bd5fc6de8ef4c76671885bd965473be # v1.6.0
    secrets: inherit

  # Dual-stack naming (CI_STANDARD B4): this lints the React app, not the Go
  # code, so it carries the web- prefix. A bare `lint` here would read as the
  # Go linter it is not.
  web-lint:
    needs: web-build
    uses: aurum-alpha/workflows/.github/workflows/job-node-lint.yml@03728a3d8bd5fc6de8ef4c76671885bd965473be # v1.6.0
    with:
      workdir: web
    secrets: inherit

  image:
    name: image
    needs: [build, web-build, gofmt, vet, test-unit, web-lint]
    runs-on: ${{ vars.RUNNER || 'ubuntu-26.04' }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: fastgen
            image_suffix: fastgen
          - target: fastproxy
            image_suffix: fastproxy
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Download binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: go-binaries
          path: bin/

      # fastgen serves the React app from files in the image, so Dockerfile.prod
      # packages this alongside the binary.
      - name: Download UI dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: web/dist/

      - name: Restore execute bit
        run: chmod 755 bin/fastgen bin/fastproxy

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.image_suffix }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=build-${{ github.run_number }},enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=ref,event=branch

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile.prod
          target: ${{ matrix.target }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  ci-ok:
    name: ci-ok
    needs: [go-mod, web-build, build, gofmt, vet, test-unit, web-lint, image]
    if: always()
    runs-on: ${{ vars.RUNNER || 'ubuntu-26.04' }}
    permissions: {}
    steps:
      - name: Fail on failed or cancelled dependencies
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
