version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Minor and patch bumps arrive as ONE pull request per run instead of one
    # per action. Majors are deliberately left ungrouped: a major action bump is
    # where breakage lives, so it gets its own review and its own revert.
    # Security updates are ungrouped too -- `applies-to` defaults to
    # version-updates -- so a security fix still lands on its own, immediately.
    groups:
      actions-minor-patch:
        update-types: [minor, patch]

  # Go module dependencies. Grouped on the same terms as the actions above:
  # minor and patch in one pull request, majors and security updates on their
  # own. `gomod` is the only ecosystem key Dependabot has for Go.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      gomod-minor-patch:
        update-types: [minor, patch]

  # A bump to a package aurum-alpha/workflows' dependency-versions.json
  # asserts fails check-dependency-versions until the fleet moves it as a wave.
  - package-ecosystem: npm
    directory: /client
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  # Images. `docker` reads the FROM lines of the Dockerfiles; `docker-compose`
  # reads the compose files' `image:` keys. One image is often pinned in both,
  # so the two share one multi-ecosystem group and a bump moves every copy in
  # one pull request. Dependabot reads a literal FROM only, never an ARG
  # default. GitHub documents `docker-compose` as supporting version updates
  # only, so a CVE fix for a compose-only image arrives with the weekly run.
  - package-ecosystem: docker
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: images
    # A database major is a data migration, made on purpose with the
    # deployed stack beside it, never a weekly bump. Minor and patch
    # releases still arrive.
    ignore:
      - dependency-name: "postgres"
        update-types: [version-update:semver-major]
      - dependency-name: "*/postgres"
        update-types: [version-update:semver-major]
      - dependency-name: "pgvector/pgvector"
        update-types: [version-update:semver-major]
      - dependency-name: "mysql"
        update-types: [version-update:semver-major]
      - dependency-name: "*/mysql"
        update-types: [version-update:semver-major]

  - package-ecosystem: docker-compose
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: images
    # A database major is a data migration, made on purpose with the
    # deployed stack beside it, never a weekly bump. Minor and patch
    # releases still arrive.
    ignore:
      - dependency-name: "postgres"
        update-types: [version-update:semver-major]
      - dependency-name: "*/postgres"
        update-types: [version-update:semver-major]
      - dependency-name: "pgvector/pgvector"
        update-types: [version-update:semver-major]
      - dependency-name: "mysql"
        update-types: [version-update:semver-major]
      - dependency-name: "*/mysql"
        update-types: [version-update:semver-major]

multi-ecosystem-groups:
  images:
    schedule:
      interval: weekly
