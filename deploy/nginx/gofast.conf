# GoFAST nginx edge (TLS + host routing)
#
# Edit server_name values to your domains. Mount PEMs as:
#   /etc/nginx/certs/fullchain.pem
#   /etc/nginx/certs/privkey.pem
#
# Upstreams use Docker Compose service DNS on the gofast network.
# Enable COMPOSE_PROFILES=edge (and proxy when using the proxy vhost).

upstream gofast_gen {
    server gen:8180;
}

upstream gofast_proxy {
    server proxy:8181;
}

# --- fastgen (UI, M3U, XMLTV, logos, healthz, metrics) ---

server {
    listen 80;
    listen [::]:80;
    server_name gofast.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name gofast.example.com;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://gofast_gen;
    }
}

# --- fastproxy (optional; requires COMPOSE_PROFILES including proxy) ---

server {
    listen 80;
    listen [::]:80;
    server_name gofast-proxy.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name gofast-proxy.example.com;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://gofast_proxy;
    }
}
